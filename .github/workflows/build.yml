name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Prepare environment and keystore
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Copy base template if available
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          # Inject SIMKL_CLIENT_ID from secrets if provided
          if [ -n "$SIMKL_CLIENT_ID" ]; then
            sed -i '/^SIMKL_CLIENT_ID=/d' .env
            echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          fi
          
          # If custom KEYSTORE_BASE64 is provided in GitHub Secrets, use it
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: |
            Automated nightly release.
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
