name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests & Coverage Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          simkl_client_id: ${{ secrets.SIMKL_CLIENT_ID }}
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Run Unit Tests and Generate Coverage Report
        run: |
          chmod +x ./gradlew
          ./gradlew test koverXmlReport --stacktrace

      - name: Post Coverage Report Comment on Pull Request
        uses: madrapps/jacoco-report@v1.8.0
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          paths: ${{ github.workspace }}/app/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 90
          title: 'Coverage Report'
          update-comment: true

  release:
    name: Build APK & Publish Edge Release
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      
    steps:
      # Use the same exact block as the test job
      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          simkl_client_id: ${{ secrets.SIMKL_CLIENT_ID }}
          keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Publish Edge Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: edge
          name: "Edge Build"
          body: |
            Automated edge release.
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
