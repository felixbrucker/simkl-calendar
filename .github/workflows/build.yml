name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build APK & Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Prepare environment and keystore
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Copy base template if available
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          
          # Inject SIMKL_CLIENT_ID from secrets if provided
          if [ -n "$SIMKL_CLIENT_ID" ]; then
            sed -i '/^SIMKL_CLIENT_ID=/d' .env
            echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
          fi
          
          # If custom KEYSTORE_BASE64 is provided in GitHub Secrets, use it
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi

      - name: Run Unit Tests and Generate Coverage Report
        run: |
          chmod +x ./gradlew
          ./gradlew test koverXmlReport --stacktrace

      - name: Post Coverage Report Comment on Pull Request
        uses: madrapps/jacoco-report@v1.8.0
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          paths: ${{ github.workspace }}/app/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 90
          title: 'Coverage Report'
          update-comment: true

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Publish Edge Release
        uses: softprops/action-gh-release@v3
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: edge
          name: "Edge Build"
          body: |
            Automated edge release.
            Commit: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
