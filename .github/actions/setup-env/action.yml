name: 'Setup Android Environment'
description: 'Sets up Java and prepares the environment/keystore'

inputs:
  simkl_client_id:
    description: 'Simkl Client ID from secrets'
    required: false
  keystore_base64:
    description: 'Base64 encoded keystore from secrets'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'

    - name: Prepare environment and keystore
      shell: bash
      env:
        SIMKL_CLIENT_ID: ${{ inputs.simkl_client_id }}
        KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
        else
          touch .env
        fi
        
        if [ -n "$SIMKL_CLIENT_ID" ]; then
          sed -i '/^SIMKL_CLIENT_ID=/d' .env
          echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> .env
        fi
        
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        fi
